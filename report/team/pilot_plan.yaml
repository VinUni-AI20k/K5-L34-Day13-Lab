# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
# Mọi số dưới đây do src/lab13.py tính (hàm in_d1, in_so_cho_luat_dung).
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 mỗi nhóm → 42 nhân viên mỗi nhóm, tổng 84 > 40: không đủ người.
#   c) 20 nhân viên mỗi nhóm: trần c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt (với m = 75 chỉ được 605).
#   d) 6 depot mỗi nhóm: trần 6 / 0,02 = 300, quá xa 1.251; và chỉ 6 cụm < 20: loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m − 1) × 0,02) ≥ 859 → m ≥ 299 yêu cầu mỗi người (DE 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: bốc thăm bằng code với seed ghi trước, phân tầng theo depot; không để trưởng nhóm chọn.
#   3. Ảnh hưởng gián tiếp và cách giảm: nhân viên cùng depot có thể chia sẻ câu trả lời; khoá quyền trợ lý theo tài khoản và log lượt mở theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu 2026-12-07.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm (40 nhân viên CSKH chia đôi).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Không cách chia theo cụm nào đủ mẫu cho mức chênh 5 điểm với 40 nhân viên. Nhóm chọn 20 + 20 nhân viên
#   và nâng mức chênh tối thiểu lên 6 điểm (n = 859, m ≥ 299 yêu cầu/người). Nếu tác động thật chỉ 5 điểm,
#   power còn khoảng 0,64: Giám đốc vận hành phải ký chấp nhận con số này trước ngày bắt đầu.
#   Khả thi về khối lượng: phạm vi chiếm 982/1.200 yêu cầu → khoảng 36.800 yêu cầu/tháng, tức khoảng 920 yêu cầu/nhân viên/tháng,
#   nên 299 yêu cầu/người đạt được trong khoảng 2 tuần ở bước 0.50.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại 4,25% (51/1.200) trên toàn mẫu; 3,97% (39/982) trong phạm vi noi_dia + hang_nang.
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên dùng: nhóm trợ lý cao hơn đối chứng ≥ 2 điểm, kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang ở cả 12 depot (chi phí mỗi việc thành công 2.696 đ = 0,22× và 8.221 đ = 0,69× so với 12.000 đ, simulated). Loại quoc_te (22.515 đ = 1,88×, thành công 27,3%, lần chạy 3 chỉ ok 2,2%) và doi_tac (10.215 đ = 0,85×, có điều khoản riêng)."
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 → 10 → 20 nhân viên dùng trợ lý; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 0,05 không đủ mẫu với 40 nhân viên; power ở 5 điểm còn 0,64
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96           # m = 299 yêu cầu mỗi nhân viên, ICC 0,02
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot; chia ngẫu nhiên bằng code, seed ghi trước, phân tầng theo depot."
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời của trợ lý. Giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id; nếu nhóm đối chứng có lượt mở thì ghi là vi phạm và báo cáo riêng."
    predeclared: "Có: chỉ số chính, mde 0,06, ba luật dừng và ngày quyết định 2027-01-11 chốt trước ngày bắt đầu 2026-12-07."
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên hoặc vượt 6%, hoặc có từ 1 ca hoàn tiền trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và Kỹ sư trưởng agent rà toàn bộ trace của các ca đó trong 2 ngày KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ (khoảng 2,3 lần mức 3.414 đ của phạm vi, simulated) hoặc tỉ lệ làm lại vượt 7% (đợt chạy thử 4,89%) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được giữ hang_nang trong phạm vi"
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa + bỏ trên số được xem lại) vượt 40% (đợt chạy thử 27,12%) TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và báo cáo lý do cho PM trợ lý hoàn phí KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, có hiệu lực trong 30 phút; mọi yêu cầu mới quay về luồng nhân viên tự làm (6 phút, 12.000 đ/yêu cầu); yêu cầu đang xử lý được chuyển nhân viên kèm tóm tắt và trace_id."
  decision_date: "2027-01-11"
  simulated_inputs:
    - "phut_xem_lai_simulated: xem lại 1.780.000 đ, chiếm 40,7% tổng chi phí"
    - "phut_lam_lai_simulated: làm lại 2.264.000 đ, chiếm 51,8% tổng chi phí; trung bình 15,3 phút/ca"
    - "Chi phí mỗi việc thành công 4.472 đ toàn mẫu; 3.414 đ trong phạm vi; 4.599 đ khi cộng chi phí cố định ở 45.000 yêu cầu/tháng"
    - "Chi phí mỗi việc thành công theo loại: noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ"
    - "Ngưỡng luật dừng chi phí 8.000 đ đặt dựa trên mức 3.414 đ"
    - "Xem lại 100% trong phạm vi: 11.743 đ = 0,98× (12.415 đ = 1,03× nếu làm lại 15,3 phút)"
