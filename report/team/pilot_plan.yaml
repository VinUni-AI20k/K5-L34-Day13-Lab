# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (tổng 2.502 yêu cầu; DE = 1).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 * 0,02 = 2,48 -> 3.103 yêu cầu/nhóm -> 42 nhân viên/nhóm (tổng 84 > 40 hiện có: KHÔNG ĐỦ NGƯỜI).
#   c) 20 nhân viên mỗi nhóm: giới hạn c / ICC = 20 / 0,02 = tối đa 1.000 yêu cầu hiệu dụng/nhóm (< 1.251: KHÔNG ĐẠT mức chênh 5 điểm).
#   d) 6 depot mỗi nhóm: giới hạn c / ICC = 6 / 0,02 = tối đa 300 yêu cầu hiệu dụng/nhóm (< 1.251 và < 20 cụm: LOẠI).
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: giải 20m / (1 + (m - 1) * 0,02) >= 859 -> m >= 299 yêu cầu/nhân viên (DE = 6,96; n_eff = 859,2).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm song song cùng tuần và cùng các depot với nhóm thử nghiệm.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code (seed cố định), phân tầng theo depot để cân bằng đặc thù từng kho.
#   3. Ảnh hưởng gián tiếp và cách giảm: Nhân viên cùng depot có thể chia sẻ cách dùng; giảm bằng cấp quyền truy cập theo staff_id và ghi log lượt mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trước toàn bộ trong file này trước ngày bắt đầu pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm (20 + 20 = 40 nhân viên).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận nâng MDE từ +5 điểm lên +6 điểm (m >= 299 yêu cầu/nhân viên) để đủ power 0,80 với 20 nhân viên/nhóm.
#   Hệ quả bất lợi: nếu hiệu ứng thật chỉ đạt +5 điểm thì power thực tế tại n = 859 chỉ còn 0,64 (64,1%).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn mẫu (1.200 yêu cầu): 4,25% (51/1.200). Riêng noi_dia + hang_nang (982 yêu cầu): 3,97% (39/982).
#   Ngưỡng an toàn chọn >= +2 điểm % so với đối chứng hoặc vượt trần 6% (không đặt trần 3% để tránh dừng oan ngay tuần đầu).
#   Tham chiếu thêm tỉ lệ bỏ qua gợi ý (sua + bo): 27,12% toàn mẫu (48/177), 21,09% trong noi_dia + hang_nang (27/128).

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (2.696 đ = 0,22×, thành công 95,0%) và hang_nang (8.221 đ = 0,69×, thành công 74,1%) tại toàn bộ 12 depot [simulated]; loại quoc_te (22.515 đ = 1,88×, thành công 27,3%) và doi_tac (10.215 đ = 0,85×, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên/nhóm (mỗi bước 1 tuần); đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi từ 0,05 để đạt power 0,80 với 20 cụm/nhóm (power ở +5 điểm là 0,64)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng chạy song song cùng thời gian, phân tầng theo depot"
    spillover_risk: "Trung bình trong nội bộ depot; giảm bằng phân quyền theo staff_id và log mở trợ lý"
    predeclared: "Chốt trước chỉ số chính, MDE 0,06, 3 luật dừng và ngày quyết định trước ngày chạy"
  stop_rules:
    - "NẾU tỉ lệ mo_lai_trong_7_ngay của nhóm trợ lý cao hơn đối chứng >= 2 điểm % hoặc vượt 6%, hoặc có >= 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ (simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở rộng bước rollout tiếp"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được sang bước rollout tiếp"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt hệ thống, hiệu lực trong 30 phút; khách được phục vụ theo quy trình nhân viên tự làm"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Chi phí mỗi việc thành công A2–A3 [simulated]: toàn mẫu 4.472 đ; noi_dia 2.696 đ (0,22×), hang_nang 8.221 đ (0,69×), doi_tac 10.215 đ (0,85×), quoc_te 22.515 đ (1,88×)"
    - "Chi phí trong phạm vi noi_dia + hang_nang A4 [simulated]: biến đổi 3.414 đ/việc; cộng cố định 4.599 đ/việc (45.000 yc/tháng) hoặc 5.784 đ/việc (50% khối lượng)"
    - "Độ nhạy chi phí B1–B4 [simulated]: làm lại gấp đôi 6.787 đ (+51,8%); xem lại 100% là 11.743 đ (9 phút làm lại) hoặc 12.415 đ (15,3 phút) -> đặt ngưỡng dừng chi phí 8.000 đ/việc"
