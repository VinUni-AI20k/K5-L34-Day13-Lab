# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Người giữ file: Thành viên 4. Số do src/tv4_tinh_so.py (cp4_pilot) và src/tv3_tinh_so.py (cp4_d1e) in ra.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0,70; 0,75) = 1.251 yêu cầu mỗi nhóm (DE = 1).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48 → 1.251 × 2,48 = 3.103 mỗi nhóm → 42 người mỗi nhóm, tổng 84 > 40 nhân viên: không đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt mức 5 điểm dù mỗi người xử lý bao nhiêu yêu cầu.
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300 < 1.251: không đạt, và chỉ có 6 cụm mỗi nhóm (dưới 20).
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m − 1) × 0,02) ≥ 859 → m ≥ 299 yêu cầu mỗi người, DE = 6,96.
#      Trong phạm vi có ≈ 1.228 yêu cầu/ngày = 30,7 yêu cầu/nhân viên/ngày → cần ≈ 10 ngày ở bước 0.50 để mỗi người đủ 299.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot, cùng loại yêu cầu với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: bốc thăm bằng code với seed ghi trước, phân tầng theo 12 depot; trưởng nhóm không được tự chọn.
#   3. Ảnh hưởng gián tiếp và cách giảm: nhân viên cùng depot có thể chia sẻ câu trả lời của trợ lý; cấp quyền theo tài khoản, log lượt mở trợ lý theo staff_id, mục tiêu 0% lượt mở từ nhóm đối chứng.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chỉ số chính, MDE 6 điểm, 4 luật dừng và ngày quyết định 2027-01-18 được commit trước ngày bắt đầu 2026-12-07.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận: chia theo nhân viên chỉ đạt mức chênh 6 điểm, không đạt 5 điểm (trần 1.000 < 1.251).
#   Con số bất lợi: nếu tác động thật chỉ 5 điểm thì với 859 yêu cầu mỗi nhóm, power chỉ còn ≈ 0,64 (statsmodels NormalIndPower).
#   Giám đốc vận hành ký chấp nhận đánh đổi này trước ngày bắt đầu. Chia theo yêu cầu đủ mẫu nhưng tràn tác động cao; chia theo depot chỉ 6 cụm.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn mẫu 4,25% (51/1.200); phạm vi noi_dia + hang_nang 3,97% (39/982): noi_dia 3,16%, hang_nang 8,23%.
#   Ngưỡng tuyệt đối 3% sẽ làm pilot dừng ngay tuần đầu. Chọn so với nhóm đối chứng (chênh ≥ 2 điểm) kèm trần tuyệt đối 6% cho cả nhóm trợ lý.
#   hang_nang đã ở mức 8,23% trong đợt chạy thử, nên hang_nang được so riêng với hang_nang của nhóm đối chứng, không áp trần 6% riêng.
#
# Giả định đề cho (không phải số giả lập): baseline 0,70; alpha 0,05; power 0,8; ICC 0,02; 40 nhân viên; 12 depot; 1.500 yêu cầu/ngày.

