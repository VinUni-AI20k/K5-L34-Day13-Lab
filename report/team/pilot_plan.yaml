# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Số tính bằng src/lab13.py (mục D1). Số có nhãn simulated là giả lập.
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (DE = 1)
#   b) Theo nhân viên, m = 75: DE = 2,48; 3.103 mỗi nhóm = 42 người mỗi nhóm, tổng 84 > 40 người: không đủ người
#   c) 20 nhân viên mỗi nhóm: tối đa 20 / 0,02 = 1.000 < 1.251: không đạt
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300 < 1.251: không đạt
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: cần m >= 299 yêu cầu mỗi người (DE 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot
#   3. Ảnh hưởng gián tiếp và cách giảm: có rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trước ngày bắt đầu (decision_date 2027-01-05)
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm
#
# Đánh đổi đã chấp nhận: không cách chia theo cụm nào với 40 nhân viên đủ mẫu cho mức chênh 5 điểm,
#   nên chọn mức chênh 6 điểm (859 mỗi nhóm, m >= 299 yêu cầu mỗi người). Nếu tác động thật chỉ 5 điểm
#   thì power còn khoảng 0,64 (statsmodels NormalIndPower, n = 859).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại: 4,25% toàn mẫu (51/1.200), 3,97% trong noi_dia + hang_nang (simulated).
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên dùng so sánh với đối chứng (+2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang ở 6 depot chạy thử (0,22x và 0,69x so với 12.000 đ, simulated); loại quoc_te (1,88x, thành công 27,3%) và doi_tac (0,85x, thành công 54,4%)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4, 10, 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận, xem phần chú thích
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot với nhóm dùng trợ lý"
    spillover_risk: "Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, ngưỡng, luật dừng và ngày quyết định chốt trước ngày bắt đầu"
  stop_rules:
    - "NẾU mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm hoặc vượt 6%, hoặc có từ 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ nhân viên bỏ qua gợi ý vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated (890 phút) và phut_lam_lai_simulated (1.132 phút): xem lại và làm lại, simulated"
    - "Chi phí mỗi việc thành công 4.472 đ, theo loại yêu cầu và độ nhạy: simulated"
    - "Tỉ lệ mo_lai_trong_7_ngay 4,25% và baseline 0,70: dữ liệu giả lập của lab"
