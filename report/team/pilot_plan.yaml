# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (statsmodels NormalIndPower cho 1.250).
#   b) Theo nhân viên, m = 75: DE = 2,48 -> 3.103 yêu cầu mỗi nhóm -> 42 nhân viên mỗi nhóm (tổng 84 > 40: không đủ người).
#   c) 20 nhân viên mỗi nhóm: giới hạn c / ICC = 20 / 0,02 = tối đa 1.000 hiệu dụng < 1.251 (không đạt mức chênh 5 điểm).
#   d) 6 depot mỗi nhóm: giới hạn c / ICC = 6 / 0,02 = tối đa 300 hiệu dụng < 1.251 (và dưới 20 cụm mỗi nhóm).
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu mỗi người (DE = 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm việc cùng tuần, cùng hệ thống với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên bằng code với seed ghi trước, phân tầng theo 12 depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Rủi ro chia sẻ câu trả lời trong cùng depot; giảm bằng phân quyền theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trước ngày bắt đầu (MDE 6 điểm, n=859/nhóm, 3 luật dừng, ngày quyết định 2027-01-05).
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm (20 cụm đối chứng và 20 cụm can thiệp).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Do giới hạn 40 nhân viên không đủ 1.251 mẫu hiệu dụng cho MDE 5 điểm (tối đa 1.000), nhóm chọn chia theo nhân viên (20 + 20) và nâng MDE lên 6 điểm (n = 859/nhóm, m >= 299, DE = 6,96). Nếu tác động thật chỉ là 5 điểm thì power thực tế giảm còn 0,64 (dưới 0,80).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại là 4,25% toàn mẫu (51/1.200) và 3,97% trong phạm vi noi_dia + hang_nang (39/982). Do đó không đặt trần 3% (sẽ dừng ngay tuần đầu) mà chọn ngưỡng so với đối chứng (>= +2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (0,22×, thành công 95,0%) và hang_nang (0,69×, thành công 74,1%, simulated) trên cả 12 depot; loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên nhóm trợ lý; mỗi bước tối thiểu 1 tuần; đo chỉ số chính từ bước 0.50 (~2 tuần để đủ m >= 299)
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi từ 0,05 lên 0,06 để đạt power 0,80 với 20 nhân viên/nhóm (power=0,64 nếu hiệu ứng thật là 0,05)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng chạy song song cùng thời gian, phân tầng theo 12 depot"
    spillover_risk: "Nhân viên cùng depot có thể hỏi hoặc chia sẻ gợi ý; giảm bằng cấp quyền theo tài khoản và ghi log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chốt trước ngày bắt đầu gồm chỉ số chính (MDE 0,06, n=859/nhóm), 3 luật dừng và ngày quyết định 2027-01-05"
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn đối chứng >= 2 điểm hoặc vượt 6%, hoặc có >= 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công (tính bằng phút đo thật) > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về riêng noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở rộng cho hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) > 40% hoặc tỉ lệ mở trợ lý < 50% số ca được giao TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được tăng tỉ lệ rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt hệ thống, hiệu lực trong 30 phút; toàn bộ yêu cầu được phục vụ theo luồng nhân viên tự làm (12.000 đ/ca)"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "noi_dia cps 2.696 đ = 0,22x so với 12.000 đ [simulated]"
    - "hang_nang cps 8.221 đ = 0,69x so với 12.000 đ [simulated]"
    - "quoc_te cps 22.515 đ = 1,88x và doi_tac cps 10.215 đ = 0,85x [simulated]"
    - "phạm vi noi_dia + hang_nang cps chưa cố định 3.414 đ và có cố định 4.599 đ (45.000 yc/tháng) [simulated]"
    - "xem lại 100% noi_dia + hang_nang: 11.743 đ (0,98x) đến 12.415 đ (1,03x) [simulated] làm căn cứ đặt ngưỡng dừng chi phí 8.000 đ"
