# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 1 + 74 * 0,02 = 2,48; n = 3.103 mỗi nhóm -> cần 42 nhân viên/nhóm (tổng 84 > 40: không đủ nhân viên)
#   c) 20 nhân viên mỗi nhóm: giới hạn trên n_hiệu dụng = c / ICC = 20 / 0,02 = 1.000 < 1.251 (không bao giờ đủ mẫu cho mức chênh 5 điểm)
#   d) 6 depot mỗi nhóm: giới hạn trên n_hiệu dụng = c / ICC = 6 / 0,02 = 300 < 1.251 (không đủ mẫu)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu mỗi nhân viên (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm việc song song cùng ca/tuần tại 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với random seed cố định, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Rủi ro chia sẻ gợi ý trong depot được giảm bằng phân quyền tài khoản staff_id và ghi log truy cập.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, MDE 0,06, 3 luật dừng và ngày chốt 2027-01-05 được chốt trước.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (cụm) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận tăng MDE từ 5 điểm lên 6 điểm (n = 859/nhóm, m >= 299 yc/nhân viên) để chia theo nhân viên (20 người/nhóm) nhằm kiểm soát spillover; nếu mức chênh thực tế chỉ là 5 điểm thì power giảm còn khoảng 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Tỉ lệ hiện tại là 4,25% trên toàn bộ mẫu (3,97% trong phạm vi noi_dia + hang_nang). Ngưỡng dừng an toàn: nhóm can thiệp cao hơn đối chứng >= 2 điểm phần trăm hoặc tỷ lệ tuyệt đối vượt 6%, hoặc có >= 1 ca hoàn trùng lặp.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22x và 0,69x so với 12.000 đ, simulated); loại quoc_te (1,88x) và doi_tac (0,85x)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]
  primary_metric:
    name: "dong_trong_24h_khong_mo_lai_7_ngay"
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng làm song song cùng thời gian tại 12 depot"
    spillover_risk: "Phân quyền theo tài khoản staff_id, chỉ nhân viên nhóm can thiệp mới có quyền mở giao diện trợ lý; audit log mọi truy cập"
    predeclared: "Đặc tả chỉ số chính, ngưỡng MDE 0,06, luật dừng và ngày chốt quyết định 2027-01-05 được cam kết trước khi khởi chạy pilot"
  stop_rules:
    - "NẾU mở lại 7 ngày của nhóm can thiệp cao hơn đối chứng >= 2 điểm hoặc vượt 6%, hoặc có >= 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công > 8.000 đ [simulated] TRONG 2 tuần liên tiếp THÌ PM thu hẹp phạm vi về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở rộng sang hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành gạt cờ tắt tính năng trong 30 phút; toàn bộ khách hàng được phục vụ bằng luồng nhân viên tự làm thủ công"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated (số phút nhân viên xem lại yêu cầu hoàn phí)"
    - "phut_lam_lai_simulated (số phút nhân viên làm lại ca sai)"
    - "chi phí mỗi việc thành công 4.472 đ và 3.414 đ trong phạm vi noi_dia + hang_nang"
    - "các mức chi phí trong kịch bản độ nhạy và xem lại 100%"
