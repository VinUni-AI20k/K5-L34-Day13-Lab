# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Phương án Người 2 đề xuất để nhóm duyệt trước khi chốt hồ sơ Gate 2a.
# Chạy python lab13_cp4.py trong src/ để kiểm D1 và tỉ lệ mở lại từ CSV.
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 mỗi nhóm, kiểm định hai phía.
#   b) Theo nhân viên, m = 75: DE = 2,48, tối thiểu 3.103 yêu cầu và 42 nhân viên mỗi nhóm.
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng < 20 / 0,02 = 1.000, dưới 1.251.
#   d) 6 depot mỗi nhóm: n hiệu dụng < 6 / 0,02 = 300 và chỉ có 6 cụm mỗi nhóm.
#   e) +6 điểm phần trăm cần 859 hiệu dụng mỗi nhóm. Giải 20m / (0,98 + 0,02m) ≥ 859 cho m ≥ 299 yêu cầu mỗi nhân viên. Khi đó DE = 6,96, n thực tế = 5.980 và n hiệu dụng ≈ 859,20 mỗi nhóm.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: cùng lịch và cùng depot với nhóm can thiệp.
#   2. Ngẫu nhiên: bốc thăm bằng code với seed khóa trước, cân bằng theo depot, tổng 20 người ở mỗi nhóm.
#   3. Ảnh hưởng gián tiếp: có thể chia sẻ gợi ý trong depot. Giới hạn quyền theo staff_id, ghi log truy cập và theo dõi vi phạm phân nhóm.
#   4. Viết trước: khóa chỉ số chính, đối tượng phân tích, ngưỡng dừng và ngày quyết định trước khi phân nhóm.
#   5. Số cụm: 20 nhân viên mỗi nhóm, giữ nhóm gốc khi phân tích kể cả người ít dùng trợ lý.
#
# Đánh đổi đề xuất: chuyển MDE lên +6 điểm phần trăm để giảm tràn tác động khi chia theo nhân viên.
# Power tại +5 điểm phần trăm chỉ khoảng 0,64. Giám đốc vận hành phải duyệt đánh đổi này trước khi chạy.
#
# Mở lại trong 7 ngày: 51/1.200 = 4,25% toàn mẫu và 39/982 = 3,97% trong phạm vi.
# Trần 3% sẽ bị vượt nếu lặp lại mức của mẫu. Đề xuất so với đối chứng (chênh ≥ 2 điểm phần trăm) và đặt thêm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: >-
    Chỉ noi_dia và hang_nang tại 12 depot, với phân nhóm theo 40 nhân viên CSKH.
    A3 cho chi phí mỗi việc thành công lần lượt 2.696 đ và 8.221 đ (simulated).
    Loại quoc_te vì 22.515 đ/việc (simulated), vượt mốc 12.000 đ, và loại doi_tac vì điều khoản riêng và chi phí 10.215 đ/việc (simulated).
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # Mở cho 4, 10, rồi 20 trong 40 người. Hai bước đầu kéo dài một tuần mỗi bước nếu đạt điều kiện an toàn.
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # Cỡ mẫu hiệu dụng mỗi nhóm
    design_effect: 6.96          # Tại 299 yêu cầu mỗi nhân viên
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng dùng luồng thủ công cùng tuần và cùng depot với nhóm can thiệp. Giữ nguyên nhóm được chỉ định trong phân tích, tính sai số theo cụm nhân viên."
    spillover_risk: "Hạn chế quyền mở trợ lý theo staff_id, ghi log truy cập, nhắc không chia sẻ gợi ý giữa hai nhóm và ghi nhận vi phạm để đánh giá độ tin cậy."
    predeclared: >-
      Khóa seed, danh sách phân nhóm, 4 và 10 người mở sớm, chỉ số, tiêu chí, luật dừng và lịch trước ngày bắt đầu dự kiến 2026-12-07.
      Chỉ lấy các yêu cầu đủ điều kiện phát sinh ở bước 0,50, dự kiến từ 2026-12-21 đến hết 2027-01-03, để phân tích tác động chính.
      Mục tiêu tối thiểu 299 yêu cầu mỗi nhân viên, tương đương 5.980 mỗi nhóm nếu phân bổ đều.
      Trước mỗi lần tăng rollout, Giám đốc vận hành kiểm tra độ phủ của dữ liệu an toàn và giữ nguyên bước nếu chưa đủ yêu cầu đã theo dõi trọn 7 ngày.
      Chờ hoàn tất cửa sổ 24 giờ đóng và 7 ngày theo dõi mở lại. Nếu thiếu mẫu hoặc thời gian theo dõi, hoãn quyết định mở rộng và ghi mốc rà soát mới.
  stop_rules:
    - "NẾU tỉ lệ mở lại của nhóm có quyền dùng trợ lý cao hơn đối chứng ≥ 2 điểm phần trăm hoặc vượt 6% TRONG 3 lần kiểm tra hằng ngày liên tiếp trên các yêu cầu đã đủ 7 ngày theo dõi THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và yêu cầu rà các ca mở lại KHÔNG THÌ giữ bước hiện tại cho đến khi đạt điều kiện an toàn để chuyển bước"
    - "NẾU phát hiện ≥ 1 ca xác nhận hoàn tiền trùng TRONG bất kỳ 24 giờ nào THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và yêu cầu kế toán đối soát sổ cái KHÔNG THÌ tiếp tục đối soát hằng ngày tại bước hiện tại"
    - "NẾU chi phí biến đổi mỗi việc thành công vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia, giới hạn 2 lần chạy và chặn tăng rollout KHÔNG THÌ giữ phạm vi theo lịch nếu các luật khác đều đạt"
    - "NẾU tỉ lệ sửa hoặc bỏ gợi ý trên số yêu cầu xem lại vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH giữ nguyên bước và phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ tiếp tục theo dõi hằng tuần"
  interim_looks: "Theo dõi an toàn, chi phí và mức sử dụng để áp dụng luật dừng. Chỉ phân tích tác động trên chỉ số chính sau khi đủ mẫu và kết thúc theo dõi."
  rollback: "Giám đốc vận hành tắt cờ trợ lý cho toàn bộ nhân viên trong 30 phút, chuyển các yêu cầu đang xử lý về luồng thủ công. Kế toán đối soát các khoản đang chờ trước khi gửi lại để tránh hoàn trùng."
  decision_date: "2027-01-12"      # Dự kiến, chốt sau khi đủ mẫu và đủ thời gian theo dõi.
  simulated_inputs:
    - "Mô hình A3 sử dụng phut_xem_lai_simulated và phut_lam_lai_simulated để ước tính 2.696, 8.221, 22.515 và 10.215 đ/việc theo bốn loại (simulated)."
    - "Ngưỡng chi phí 8.000 đ/việc là giả định điều hành pilot. Đo phút xem lại và phút làm lại thực tế từ tuần đầu để áp dụng luật dừng."
