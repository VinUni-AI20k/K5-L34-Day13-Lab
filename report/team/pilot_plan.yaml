# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
#
# D1 · Cỡ mẫu (baseline 0,70; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu, MDE 5 điểm: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 2,48; cần 3.103 yêu cầu mỗi nhóm = 42 nhân viên/nhóm, tổng 84 > 40.
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng tối đa = 20 / 0,02 = 1.000 < 1.251, không đạt MDE 5 điểm.
#   d) 6 depot mỗi nhóm: n hiệu dụng tối đa = 6 / 0,02 = 300, không đạt.
#   e) MDE 6 điểm: 859 yêu cầu mỗi nhóm; với 20 nhân viên/nhóm cần >= 299 yêu cầu/người (DE 6,96).
#
# D2 · Tách được tác động:
#   1. Đối chứng: 20 nhân viên đối chứng làm cùng tuần, cùng depot.
#   2. Phân bổ: bốc thăm bằng code, seed ghi trước, phân tầng theo depot.
#   3. Spillover: khóa quyền theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Viết trước: chỉ số, ngưỡng, luật dừng và ngày quyết định được chốt trước khi bắt đầu.
#   5. Cụm: có đúng 20 nhân viên mỗi nhóm.
# Đánh đổi: chọn chia theo nhân viên để giảm spillover; chỉ đủ power cho MDE 6 điểm (power khoảng 0,64 nếu tác động thật là 5 điểm).
# Tỉ lệ mo_lai_trong_7_ngay: toàn bộ 4,25% (51/1.200); phạm vi noi_dia + hang_nang 3,97%.

