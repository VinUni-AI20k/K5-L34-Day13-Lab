# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; n = 3.103 mỗi nhóm -> 42 nhân viên/nhóm (tổng 84 > 40: không đủ người)
#   c) 20 nhân viên mỗi nhóm: giới hạn trần c/ICC = 20 / 0,02 = 1.000 < 1.251 (không đạt mục tiêu 5 điểm)
#   d) 6 depot mỗi nhóm: giới hạn trần 6 / 0,02 = 300 (không đạt)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu mỗi người (DE 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm việc song song cùng tuần, cùng depot với 20 nhân viên can thiệp.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed cố định ghi trước, phân tầng theo 12 depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có nguy cơ chia sẻ gợi ý trong cùng depot; giảm thiểu bằng cấp quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Đã xác định và đóng băng trước khi chạy: chỉ số chính (đóng trong 24h và không mở lại 7 ngày), ngưỡng dừng và ngày quyết định.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 cụm nhân viên cho mỗi nhóm (20 can thiệp, 20 đối chứng).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
# Chấp nhận mức chênh tối thiểu phát hiện được là 6 điểm (thay vì 5 điểm) để duy trì thiết kế ngẫu nhiên 20 cụm nhân viên; nếu mức chênh thật chỉ đạt 5 điểm thì power giảm xuống còn khoảng 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
# Tỉ lệ mở lại hiện tại là 4,25% trên toàn bộ mẫu 1.200 yêu cầu (3,97% trong phạm vi noi_dia + hang_nang). Ngưỡng an toàn dừng: nhóm trợ lý cao hơn đối chứng >= 2 điểm hoặc vượt trần 6,00%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"                      # một người có tên vai trò, không ghi "cả đội"
  scope: "Chỉ noi_dia và hang_nang (0,22x và 0,69x so với 12.000 đ, simulated); loại quoc_te (1,88x) và doi_tac (0,85x)" # loại yêu cầu nào, depot nào; dựa vào kết quả A3
  assignment:
    unit: "staff"                     # request | staff | depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # lần lượt khoảng 4, 10, 20 nhân viên can thiệp trên tổng 40 người
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96            # 1 nếu chia theo yêu cầu
    clusters_per_arm: 20         # để trống nếu chia theo yêu cầu
  identifiability:
    concurrent_control: "20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên nhóm can thiệp"
    spillover_risk: "Giảm rủi ro chia sẻ câu trả lời trong depot bằng cách phân quyền tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Chỉ số chính, ngưỡng dừng an toàn, luật dừng và ngày quyết định được chốt và ký duyệt trước khi pilot khởi chạy"
  stop_rules:
    - "NẾU tỉ lệ mở lại vượt 6%, có >= 1 ca hoàn trùng cùng yêu cầu, hoặc đã báo khách hoàn nhưng sổ cái chưa ghi TRONG bất kỳ bước rollout nào THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước tiếp"
    - "NẾU từ bước 10 nhân viên can thiệp trở lên, tỉ lệ mở lại nhóm trợ lý cao hơn đối chứng >= 2 điểm TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước tiếp"
    - "NẾU chi phí vận hành mỗi việc thành công (token/tool và giờ nhân viên, chưa gồm 40 triệu chi phí cố định tháng) > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "Bước 4 người: chỉ theo dõi an toàn tuyệt đối; từ bước 10 người: có thể dùng ngưỡng chênh lệch 2 điểm; chỉ đánh giá chỉ số chính ở bước 20 sau khi mỗi nhân viên đạt ít nhất 299 yêu cầu (khoảng 8 ngày ở 37–38 yêu cầu/ngày) và đã đủ cửa sổ theo dõi mở lại 7 ngày cho yêu cầu cuối."
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"                   # ai bấm, mất bao lâu, khách được phục vụ bằng gì
  decision_date: "2027-01-05"
  simulated_inputs: ["phut_xem_lai_simulated", "phut_lam_lai_simulated", "chi_phi_moi_viec_thanh_cong_simulated", "he_so_so_voi_12000_simulated"]         # liệt kê mọi con số giả lập đã dùng
