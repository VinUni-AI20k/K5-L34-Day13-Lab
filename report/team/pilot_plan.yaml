# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Số tính bằng src/lab13.py (mục D1). Cách chia chọn: theo nhân viên, 20 + 20, ngẫu nhiên.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yeu cau: 1.251 yeu cau moi nhom
#   b) Theo nhan vien, m = 75: DE = 1 + 74 x 0,02 = 2,48; n = 3.102 moi nhom -> 42 nguoi moi nhom, tong 84 > 40: khong du nguoi
#   c) 20 nhan vien moi nhom: co mau hieu dung toi da 20 / 0,02 = 1.000 < 1.251: khong dat
#   d) 6 depot moi nhom: toi da 6 / 0,02 = 300
#   e) Muc chenh 6 diem (859 moi nhom), 20 nhan vien moi nhom: m >= 299 yeu cau moi nguoi (DE 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Doi chung chay cung thoi gian: co, 20 nhan vien doi chung lam cung tuan, cung depot
#   2. Chia ngau nhien: boc tham bang code, seed ghi truoc, phan tang theo depot
#   3. Anh huong gian tiep: co rui ro chia se cau tra loi trong depot; giam bang quyen truy cap theo tai khoan va log luot mo tro ly theo staff_id
#   4. Chi so chinh, nguong, luat dung va ngay quyet dinh chot truoc ngay bat dau: co
#   5. It nhat 20 cum moi nhom: co, dung 20 nhan vien moi nhom
#
# Đánh đổi đã chấp nhận: khong cach chia theo cum nao du mau cho muc chenh 5 diem (toi da 1.000 < 1.251).
#   Nhom chap nhan chi thay duoc muc chenh 6 diem (859 moi nhom, moi nhan vien >= 299 yeu cau).
#   Neu tac dong that chi la 5 diem thi power con khoang 0,64. Giam doc van hanh phai ky chap nhan.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại: 4,25% (51/1.200) toàn mẫu, 3,97% trong phạm vi noi_dia + hang_nang (simulated).
#   Nguong tuyet doi 3% se dung pilot ngay tuan dau, nen dung so voi doi chung (+2 diem) kem tran tuyet doi 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (chi phí 0,22× và 0,69× so với 12.000 đ, simulated); loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, điều khoản riêng) nằm ngoài pilot"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: khoảng 4 -> 10 -> 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận (không đủ mẫu cho 0,05)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot với nhóm dùng trợ lý"
    spillover_risk: "Có rủi ro nhân viên chia sẻ câu trả lời trong cùng depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, ngưỡng, luật dừng và ngày quyết định chốt trước ngày bắt đầu; bốc thăm bằng code với seed ghi trước, phân tầng theo depot"
  stop_rules:
    - "NẾU mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm trở lên, hoặc vượt 6% tuyệt đối, hoặc có từ 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ (simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"     # giả định của nhóm, chốt trước ngày bắt đầu; xác nhận lại với Giám đốc vận hành
  simulated_inputs: ["phut_xem_lai_simulated", "phut_lam_lai_simulated", "chi phí mỗi việc thành công 4.472 đ", "chi phí theo loại (A3)", "chi phí cố định 40 triệu đ/tháng và 12.000 đ nhân viên tự làm (giả định của lab)"]
