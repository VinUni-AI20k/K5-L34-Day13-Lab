# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu (+5 điểm): 1.251 yêu cầu/nhóm (statsmodels: 1.250).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 * 0,02 = 2,48 -> cần 3.103 yêu cầu/nhóm = 42 người/nhóm (tổng 84 > 40 -> không đủ người).
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa = 20 / 0,02 = 1.000 (< 1.251 -> không đạt mục tiêu +5 điểm).
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa = 6 / 0,02 = 300 (< 1.251 -> không đạt, và chỉ có 6 cụm < 20).
#   e) Mức chênh 6 điểm (n = 859/nhóm), 20 nhân viên mỗi nhóm: cần m >= 299 yêu cầu/người (DE = 6,96, tổng 5.980 yêu cầu/nhóm).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng và 20 nhân viên dùng trợ lý làm việc song song trong cùng các tuần, cùng 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên hoàn toàn bằng code (có seed ghi trước), phân tầng theo depot để cân bằng đặc thù từng kho.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot trao đổi hoặc nhờ tra giúp; giảm bằng cách cấp quyền truy cập trợ lý theo tài khoản staff_id riêng, không chia sẻ màn hình gợi ý và ghi log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, toàn bộ chỉ số chính (mục tiêu +6 điểm), 3 luật dừng, kiểm tra giữa kỳ chỉ xem an toàn và ngày quyết định chốt trước khi bắt đầu pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đạt đúng 20 nhân viên (cụm) cho mỗi nhóm can thiệp và đối chứng.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên hiện có và ICC = 0,02, không cách chia theo cụm nào đủ mẫu phát hiện mức chênh +5 điểm (tối đa 1.000 < 1.251).
#   Nhóm chọn chia theo nhân viên (20 + 20) để giữ tách tác động tốt (20 cụm/nhóm) và chấp nhận nâng mức chênh tối thiểu phát hiện (MDE) lên +6 điểm (859 mẫu hiệu dụng/nhóm, m >= 299 yêu cầu/nhân viên).
#   Hệ quả bất lợi: nếu tác động thật chỉ là +5 điểm, power giảm từ 0,80 xuống còn 0,64 (rủi ro bỏ sót tác động thật 36%).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại toàn mẫu là 4,25% (51/1.200) và trong phạm vi noi_dia + hang_nang là 3,97% (39/982).
#   Không đặt ngưỡng tuyệt đối thấp hơn 4% để tránh dừng giả ngay tuần đầu; đặt ngưỡng tương đối cao hơn nhóm đối chứng >= 2 điểm phần trăm hoặc vượt trần tuyệt đối 6%, hoặc phát sinh >= 1 ca hoàn tiền trùng.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ xử lý yêu cầu loại noi_dia và hang_nang tại 12 depot (chi phí lần lượt 0,22x và 0,69x so với 12.000 đ, simulated); loại khỏi pilot loại quoc_te (1,88x, thành công 27,3%) và doi_tac (0,85x, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần (4 -> 10 -> 20 nhân viên); chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có; 20 nhân viên nhóm đối chứng xử lý song song trong cùng thời gian và cùng 12 depot với 20 nhân viên nhóm dùng trợ lý"
    spillover_risk: "Trung bình (nhân viên cùng depot có thể trao đổi); giảm thiểu bằng phân quyền theo tài khoản staff_id riêng, quy định không chia sẻ gợi ý và theo dõi log sử dụng theo staff_id"
    predeclared: "Có; chỉ số chính, MDE 0,06, 3 luật dừng, quy tắc xem giữa kỳ và ngày quyết định 2027-01-05 được chốt bằng văn bản trước ngày chạy pilot"
  stop_rules:
    - "NẾU tỉ lệ mo_lai_trong_7_ngay của nhóm trợ lý cao hơn nhóm đối chứng >= 2 điểm phần trăm hoặc vượt trần tuyệt đối 6%, hoặc phát sinh >= 1 ca hoàn tiền trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành LogiX-VN tắt cờ trợ lý trong vòng 30 phút và rà soát toàn bộ trace lỗi KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công đo thực tế vượt 8.000 đ/việc (hoặc tỉ lệ làm lại vượt 7%) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và áp giới hạn tối đa 2 lần chạy KHÔNG THÌ không được tiếp tục mở rộng nhóm hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo trên tổng số được xem lại) vượt 40% TRONG 1 tuần liên tiếp THÌ Trưởng nhóm CSKH phỏng vấn ít nhất 5 nhân viên nhóm can thiệp trong 3 ngày để tìm nguyên nhân và cập nhật quy trình/gợi ý KHÔNG THÌ không được tăng tỉ lệ rollout sang tuần kế tiếp"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành LogiX-VN bấm công tắc tắt (feature flag) toàn hệ thống trợ lý, có hiệu lực trong vòng 30 phút; toàn bộ yêu cầu hoàn phí tự động chuyển về luồng nhân viên CSKH tự xử lý theo quy trình chuẩn hiện hành"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated (dùng tính tiền xem lại 1.780.000 đ trong đợt chạy thử, simulated)"
    - "phut_lam_lai_simulated (dùng tính tiền làm lại 2.264.000 đ trong đợt chạy thử, simulated)"
    - "chi_phi_moi_viec_thanh_cong theo loại (noi_dia 2.696 đ = 0,22x; hang_nang 8.221 đ = 0,69x; quoc_te 22.515 đ = 1,88x; doi_tac 10.215 đ = 0,85x, đều là simulated)"
    - "chi_phi_xem_lai_100_phan_tram (11.743 đ = 0,98x với 9 phút làm lại; 12.414 đ = 1,03x với 15,3 phút làm lại, simulated)"
