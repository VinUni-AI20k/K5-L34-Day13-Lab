.chip.sim { background: var(--sim-bg); color: var(--sim-ink) }
.chip.ok { background: var(--ok-bg); color: var(--ok-ink) }
.chip.bad { background: var(--bad-bg); color: var(--bad-ink) }

.track { position: relative; height: 22px }
.track .fill { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 0 4px 4px 0; background: var(--accent) }

.track .fill.out { background: var(--accent); opacity: 0.45 }

.ref-lbl { font-size: 0.74rem; color: var(--muted); position: relative; height: 16px }

.stack { display: flex; height: 30px; gap: 2px; border-radius: 4px; overflow: hidden }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.84rem; color: var(--ink-2) }

const nf = (x, d = 0) => Number(x).toLocaleString('vi-VN', { minimumFractionDigits: d, maximumFractionDigits: d });
const dong = x => nf(x) + ' đ';
const pct = (x, d = 1) => nf(x * 100, d) + '%';
const spct = (x, d = 1) => (x >= 0 ? '+' : '−') + nf(Math.abs(x) * 100, d) + '%';
const lan = x => nf(x, 2) + '×';
const SIM = '<span class="chip sim">simulated</span>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<u>$1</u>')
  .replace(/\[simulated\]|\(`simulated`\)/g, SIM);
const $ = (s, el = document) => el.querySelector(s);
const tipAttr = t => ` data-tip="${esc(t)}"`;
const statusChip = s => /giả lập/i.test(s) ? `<span class="chip sim">${esc(s)}</span>` : /^xong/i.test(s) ? `<span class="chip ok">${esc(s)}</span>` : `<span class="chip bad">${esc(s)}</span>`;

const DEF = { kt: 1, kx: 1, kl: 1, w: 2000, k: 3, scope: 'toan_mau', fixed: false, vol: 45000 };

function tinh(s) {
  const t = D.tp[s.scope][String(s.k)];
  const token = (t.tin / 1000 * G.vao + t.tout / 1000 * G.ra) * s.kt;
  const tool = t.tool * G.tool, xem = t.px * s.w * s.kx, lam = t.pl * s.w * s.kl;
  const tong = token + tool + xem + lam;
  const coDinh = s.fixed ? G.co_dinh / (s.vol * t.tc / 1200) : 0;
  const cps = tong / t.tc + coDinh;
  const nv = 6 * s.w;
  return { t, token, tool, xem, lam, tong, coDinh, cps, nv, heThong: tong + (t.n - t.tc) * nv };
}

function bindDoNhay() {
  const ids = ['kt', 'kx', 'kl', 'w', 'vol'];
  const sync = () => {
    ids.forEach(id => $('#' + id).value = S[id]);
    $('#fixed').checked = S.fixed; $('#vol').disabled = !S.fixed;
    document.querySelectorAll('#scope button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.scope));
    document.querySelectorAll('#lim button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === String(S.k)));
    render();
  };
  const render = () => {
    const r = tinh(S), base = tinh({ ...DEF, scope: S.scope });
    $('#o-kt').textContent = `${nf(G.vao * S.kt, 1)} / ${nf(G.ra * S.kt, 1)} đ (×${nf(S.kt, 2)})`;
    $('#o-kx').textContent = '×' + nf(S.kx, 1);
    $('#o-kl').textContent = '×' + nf(S.kl, 1);
    $('#o-w').textContent = nf(S.w) + ' đ/phút';
    $('#o-vol').textContent = nf(S.vol) + ' yc/tháng';
    $('#o-cps').textContent = dong(r.cps);
    const d = r.cps / base.cps - 1;
    $('#o-delta').innerHTML = Math.abs(d) < 5e-5 ? `Bằng mức mặc định của phạm vi này` : `${spct(d)} so với mặc định của phạm vi này (${dong(base.cps)})`;
    const ratio = r.cps / r.nv, mx = Math.max(r.cps, r.nv) * 1.15;
    $('#m-fill').style.width = (r.cps / mx * 100) + '%';
    $('#m-fill').style.background = ratio > 1 ? 'var(--up)' : 'var(--accent)';
    $('#m-ref').style.left = (r.nv / mx * 100) + '%';
    $('#m-lbl').innerHTML = `Bằng <b class="num">${lan(ratio)}</b> mức nhân viên tự làm (vạch đen, ${dong(r.nv)}) · ${ratio > 1 ? '<span class="chip bad">đắt hơn nhân viên</span>' : '<span class="chip ok">rẻ hơn nhân viên</span>'}`;
    const parts = [['Token', r.token, 'var(--c1)'], ['Tool', r.tool, 'var(--c3)'], ['Xem lại', r.xem, 'var(--c4)'], ['Làm lại', r.lam, 'var(--c2)'], ['Cố định', r.coDinh * r.t.tc, 'var(--staff)']].filter(p => p[1] > 0);
    const tot = parts.reduce((a, p) => a + p[1], 0);
    $('#o-stack').innerHTML = parts.map(([n, v, c]) => `<div style="width:${v / tot * 100}%;background:${c}"${tipAttr(`${n}: ${dong(v / r.t.tc)}/việc (${pct(v / tot)})`)}></div>`).join('');
    $('#o-leg').innerHTML = parts.map(([n, v, c]) => `<span><i style="background:${c}"></i>${n} <span class="num">${nf(v / r.t.tc)} đ</span></span>`).join('');
    $('#o-tc').textContent = `${nf(r.t.tc)} / ${nf(r.t.n)}`;
    $('#o-fail').textContent = nf(r.t.n - r.t.tc);
    $('#o-tong').textContent = dong(r.tong);
    $('#o-ht').textContent = dong(r.heThong);
  };
  ids.forEach(id => $('#' + id).addEventListener('input', e => { S[id] = +e.target.value; render(); }));
  $('#fixed').addEventListener('change', e => { S.fixed = e.target.checked; sync(); });
  document.querySelectorAll('#scope button').forEach(b => b.onclick = () => { S.scope = b.dataset.v; sync(); });
  document.querySelectorAll('#lim button').forEach(b => b.onclick = () => { S.k = +b.dataset.v; sync(); });
  $('#reset').onclick = () => { S = { ...DEF }; sync(); };
  const PRESET = [{ kt: 2 }, { kt: 0.5 }, { kx: 2 }, { kx: 0.5 }, { kl: 2 }, { kl: 0.5 }, { w: 2500 }, { k: 2 }, { k: 1 }];
  document.querySelectorAll('[data-b1]').forEach(el => {
    const go = () => { S = { ...DEF, ...PRESET[+el.dataset.b1] }; sync(); $('.calc').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    el.onclick = go; el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
  sync();
}

const ZA = 1.959963985, ZB = 0.841621234;
function coMau(p1, p2) { const pb = (p1 + p2) / 2; return Math.ceil((ZA * Math.sqrt(2 * pb * (1 - pb)) + ZB * Math.sqrt(p1 * (1 - p1) + p2 * (1 - p2))) ** 2 / (p2 - p1) ** 2); }
function phi(x) { const t = 1 / (1 + 0.2316419 * Math.abs(x)), dd = 0.3989423 * Math.exp(-x * x / 2); const p = dd * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; }
function power(p1, p2, n) { const pb = (p1 + p2) / 2; return phi((Math.abs(p2 - p1) * Math.sqrt(n) - ZA * Math.sqrt(2 * pb * (1 - pb))) / Math.sqrt(p1 * (1 - p1) + p2 * (1 - p2))); }
let P = { mde: 6, icc: D.d1.icc, c: 20, m: D.d1.m_min };

function bindPilot() {
  const ids = ['mde', 'icc', 'c', 'm'];
  const sync = () => { ids.forEach(id => $('#' + id).value = P[id]); render(); };
  const render = () => {
    const need = coMau(0.70, 0.70 + P.mde / 100), de = 1 + (P.m - 1) * P.icc, eff = P.c * P.m / de;
    const cap = P.icc > 0 ? P.c / P.icc : Infinity, ok = eff >= need, du20 = P.c >= 20;
    $('#o-mde').textContent = P.mde + ' điểm'; $('#o-icc').textContent = nf(P.icc, 3);
    $('#o-c').textContent = nf(P.c); $('#o-m').textContent = nf(P.m);
    $('#p-eff').textContent = nf(eff);
    $('#p-verdict').innerHTML = `${ok ? '<span class="chip ok">đủ mẫu</span>' : '<span class="chip bad">thiếu mẫu</span>'} ${du20 ? '<span class="chip ok">≥ 20 cụm mỗi nhóm</span>' : '<span class="chip bad">dưới 20 cụm</span>'}${!ok && cap < need ? ' <span class="chip bad">trần thấp hơn mức cần, tăng m cũng không đủ</span>' : ''}`;
    const mx = Math.max(eff, need) * 1.15;
    $('#p-fill').style.width = (eff / mx * 100) + '%'; $('#p-fill').style.background = ok ? 'var(--accent)' : 'var(--up)';
    $('#p-ref').style.left = (need / mx * 100) + '%';
    $('#p-need').textContent = nf(need); $('#p-de').textContent = nf(de, 2);
    $('#p-cap').textContent = isFinite(cap) ? nf(cap) : '∞';
    $('#p-pw').textContent = nf(power(0.70, 0.75, eff), 2);
  };
  ids.forEach(id => $('#' + id).addEventListener('input', e => { P[id] = +e.target.value; render(); }));
  const PZ = { yc: { c: 1251, m: 1, mde: 5 }, nv: { c: 20, m: D.d1.m_min, mde: 6 }, dp: { c: 6, m: 2000, mde: 5 } };
  document.querySelectorAll('#dz button').forEach(b => b.onclick = () => { P = { ...P, icc: D.d1.icc, ...PZ[b.dataset.p] }; sync(); });
  sync();
}
